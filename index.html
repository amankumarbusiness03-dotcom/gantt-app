  const segmentMetrics = (startDate, endDate, minWidth = 0.6) => {
    if (!startDate || !endDate || endDate < minD || startDate > maxD || endDate < startDate) return null;
    const clampedStart = startDate < minD ? minD : startDate;
    const clampedEnd = endDate > maxD ? maxD : endDate;
    const left = pctOf(clampedStart);
    const right = pctOf(clampedEnd);
    return { left, width: Math.max(minWidth, right - left), endPct: right };
  };

  funcs.forEach(f => {
    const ft = tasks.filter(t => t.func === f);
    if (!ft.length) return;
    const isCollapsed = collapsedFuncs.has(f);
    const grpRed   = ft.filter(t=>t._rag==='red').length;
    const grpAmber = ft.filter(t=>t._rag==='amber').length;
    const ragSummary = grpRed
      ? `<span style="font-size:9px;color:var(--rag-red);font-family:var(--mono);margin-left:8px">^ ${grpRed} overdue</span>`
      : grpAmber
      ? `<span style="font-size:9px;color:var(--rag-amber);font-family:var(--mono);margin-left:8px">* ${grpAmber} at risk</span>`
      : '';

    html += `<tr class="section-row${isCollapsed?' collapsed':''}">
      <td colspan="10" data-action="toggle-func" data-func='${escapeHTML(f)}' style="cursor:pointer">
        <span class="section-toggle">${isCollapsed?'▶':'▼'}</span>
        <span style="margin-right:8px;color:var(--text3);font-size:10px">${ft.length}</span>
        ${escapeHTML(f)}
        ${ragSummary}
      </td>
    </tr>`;

    ft.forEach(t => {
      const sDate = parseLocalDate(t._execStart);
      const eDate = parseLocalDate(t._execEnd);
      if (!sDate || !eDate) return;

      const plannedRaw = parseLocalDate(t._plannedEnd) || eDate;
      const plannedDisplayEnd = plannedRaw > eDate ? eDate : plannedRaw;
      const totalSeg = segmentMetrics(sDate, eDate);
      const plannedSeg = segmentMetrics(sDate, plannedDisplayEnd);
      const extensionSeg = plannedRaw < eDate ? segmentMetrics(plannedRaw, eDate) : null;
      if (!totalSeg || !plannedSeg) return;

      const rag = t._rag;
      const color = ragColor(rag);
      const rClass = ragClass(rag);
      const progress = Number(t.progressPct);
      const progressPct = Number.isFinite(progress) ? Math.max(0, Math.min(100, progress)) : 0;
      const progressHTML = progressPct > 0
        ? `<div style="position:absolute;left:${totalSeg.left.toFixed(2)}%;width:${(totalSeg.width * progressPct / 100).toFixed(2)}%;top:4px;bottom:4px;background:rgba(255,255,255,0.24);border-radius:2px;z-index:5;pointer-events:none"></div>`
        : '';

      const gridLines = majorTicks.map(tk =>
        `<div style="position:absolute;top:0;bottom:0;left:${tk.p.toFixed(2)}%;width:1px;background:${tk.bold?'rgba(255,255,255,0.10)':'var(--border)'};pointer-events:none"></div>`
      ).join('');
      const mLines = visibleMilestones.filter(m => !m.func || normalizeTaskText(m.func) === normalizeTaskText(t.func)).map(m =>
        `<div style="position:absolute;top:-3px;bottom:-3px;left:${m.p.toFixed(2)}%;width:0;border-left:1.5px solid rgba(255,220,100,0.38);z-index:8;pointer-events:none"></div>`
      ).join('');
      const todayLine = (todayPct>=0 && todayPct<=100)
        ? `<div style="position:absolute;top:-3px;bottom:-3px;left:${todayPct.toFixed(2)}%;width:2px;background:var(--today);z-index:6;border-radius:1px;pointer-events:none"></div>`
        : '';

      const ragLabel = {red:'Overdue',amber:'Due Within 3 Days',green:'Completed',blue:'In Progress',grey:'Not Started'}[rag] || 'Unknown';
      const statusText = t.executionStatus || ragLabel;
      const tip = `${t.activity} | ${fmt(t._execStart)} -> ${fmt(t._execEnd)}${t.responsible?' | '+t.responsible:''}`;
      const responsibleActive = t.responsible && t.responsible === activeOwner ? ' active-owner' : '';
      const msKey = `${t.func}::${t.activity}`;
      const isTaskMs = taskMilestones.has(msKey);
      const endPct = pctOf(eDate < minD ? minD : eDate > maxD ? maxD : eDate);
      const taskDiamond = `<div class="task-ms-diamond${isTaskMs?' task-ms-diamond-hover':''}" style="display:${isTaskMs?'':'none'};position:absolute;left:${endPct.toFixed(2)}%;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:9px;height:9px;background:rgba(255,220,100,0.95);z-index:10;${isTaskMs?'pointer-events:auto;':'pointer-events:none;'}box-shadow:0 0 7px rgba(255,220,100,0.55);"
        data-ms-type="diamond"
        data-ms-label="${escapeHTML(t.activity)}"
        data-ms-date="${t._execEnd}"
        data-ms-owner="${escapeHTML(t.responsible || '-')}"
        data-ms-start="${t._execStart}"
        data-ms-rag="${rag}"
        data-ms-rag-label="${ragLabel}"></div>`;

      html += `<tr${isCollapsed?' style="display:none"':''}>
        <td class="activity-cell">
          <span class="task-ms-btn${isTaskMs?' ms-active':''}" data-action="toggle-task-ms" data-key="${escapeHTML(msKey)}" title="${isTaskMs?'Remove milestone':'Mark as milestone'}">◆</span>${escapeHTML(t.activity)}${!t.masterMatched ? '<span style="font-size:9px;font-family:var(--mono);color:var(--text3);margin-left:5px" title="No matching row found in Master Sheet">·no master</span>' : ''}</td>
        <td>${t.responsible
          ? `<span class="owner-pill${responsibleActive}" data-action="filter-owner" data-owner="${escapeHTML(t.responsible)}" title="click to filter by ${escapeHTML(t.responsible)}">${escapeHTML(t.responsible)}</span>`
          : '<span style="color:var(--text3)">-</span>'}</td>
        <td>${dash(t.accountable)}</td>
        <td class="date-cell">${dash(fmt(t._execStart))}</td>
        <td class="date-cell">${dash(fmt(t.plannedEndDate))}</td>
        <td class="date-cell">${dash(t.leadTimeRequested)}</td>
        <td class="date-cell">${dash(fmt(t.actualEndDate))}</td>
        <td class="date-cell">${dash(t.aging)}</td>
        <td><span style="font-family:var(--mono);font-size:10px;color:${ragColor(rag)};white-space:nowrap">${escapeHTML(statusText)}</span></td>
        <td class="bar-col">
          <div class="bar-outer">
            ${gridLines}
            ${mLines}
            <div class="bar-fill ${rClass}" style="left:${plannedSeg.left.toFixed(2)}%;width:${plannedSeg.width.toFixed(2)}%;background:${color};opacity:0.88;z-index:3" title="${escapeHTML(tip)}"></div>
            ${extensionSeg ? `<div class="bar-fill" style="left:${extensionSeg.left.toFixed(2)}%;width:${extensionSeg.width.toFixed(2)}%;background:rgba(240,146,74,0.58);opacity:0.78;z-index:4" title="Lead time extension: ${escapeHTML(fmt(t.plannedEndDate))} → ${escapeHTML(fmt(t.revisedEndDate))}"></div>` : ''}
            ${progressHTML}
            ${todayLine}
            ${taskDiamond}
          </div>
        </td>
      </tr>`;
    });
  });

  html += `</tbody></table>`;

  const zoomEl = document.getElementById('zoom-bar');
  if (zoomEl) zoomEl.innerHTML = zoomBarHTML;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('table-wrap').style.display = 'block';
  document.getElementById('table-wrap').innerHTML = html;
}

function renderTable() {
  if (viewMode === 'execution') {
    renderExecutionTable();
    return;
  }

  const selFunc  = document.getElementById('funcFilter').value;
  const selPhase = document.getElementById('phaseFilter').value;
  const selOwner = document.getElementById('ownerFilter').value;
  // Keep activeOwner in sync with dropdown
  if (selOwner !== activeOwner) activeOwner = selOwner;

  let tasks = allTasks.filter(t => {
    if (selFunc  && t.func  !== selFunc)  return false;
    if (selPhase && t.phase !== selPhase) return false;
    if (activeOwner && t.owner !== activeOwner) return false;
    return true;
  });
  // Compute RAG once per task
  tasks = tasks.map(t => ({ ...t, _rag: ragStatus(t) }));

  // ── RAG stats — use pre-computed _rag ─────────────────────────────────────
  const total      = tasks.length;
  const redCount   = tasks.filter(t => t._rag === 'red').length;
  const amberCount = tasks.filter(t => t._rag === 'amber').length;
  const doneCount  = tasks.filter(t => t._rag === 'green').length;
  const ph1        = tasks.filter(t => t.phase === 'Phase 1').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">total tasks</div></div>
    <div class="stat rag-red"><div class="stat-val" style="color:var(--rag-red)">${redCount}</div><div class="stat-lbl">overdue</div></div>
    <div class="stat rag-amber"><div class="stat-val" style="color:var(--rag-amber)">${amberCount}</div><div class="stat-lbl">at risk</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--rag-green)">${doneCount}</div><div class="stat-lbl">done</div></div>
    <div class="stat"><div class="stat-val">${ph1}</div><div class="stat-lbl">phase 1</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--p2)">${total-ph1}</div><div class="stat-lbl">phase 2</div></div>
  `;

  const parseLocal = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); };
  const fmt = s => { const d = parseLocal(s); return d ? d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : s; };

  const allD = tasks.flatMap(t=>[parseLocal(t.start),parseLocal(t.end)]).filter(d=>d&&!isNaN(d));
  if (!allD.length) {
    document.getElementById('table-wrap').innerHTML = '<table><tbody><tr class="empty-row"><td colspan="6">no tasks match filters</td></tr></tbody></table>';
    document.getElementById('loading').style.display='none';
    document.getElementById('table-wrap').style.display='block';
    return;
  }

  const today = new Date(); today.setHours(0,0,0,0);

  // ── Timeline window ────────────────────────────────────────────────────────
  let minD, maxD;
  if (zoomMode === 'month' && zoomMonth) {
    minD = new Date(zoomMonth.getFullYear(), zoomMonth.getMonth(), 1);
    maxD = new Date(zoomMonth.getFullYear(), zoomMonth.getMonth()+1, 0);
    tasks = tasks.filter(t => {
      const s = parseLocal(t.start), e = parseLocal(t.end);
      return s && e && s <= maxD && e >= minD;
    });
  } else {
    const globalMin = new Date(Math.min(...allD));
    const globalMax = new Date(Math.max(...allD));
    minD = new Date(globalMin); minD.setDate(minD.getDate()-3);
    maxD = new Date(globalMax); maxD.setDate(maxD.getDate()+3);
  }

  const totalMs = maxD - minD;
  const pctOf = d => Math.max(0, Math.min(100, ((d-minD)/totalMs)*100));
  const todayPct = pctOf(today);

  // ── Ticks ──────────────────────────────────────────────────────────────────
  let majorTicks = [];
  if (zoomMode === 'month' && zoomMonth) {
    const daysInMonth = new Date(zoomMonth.getFullYear(), zoomMonth.getMonth()+1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const dt = new Date(zoomMonth.getFullYear(), zoomMonth.getMonth(), d);
      const p = pctOf(dt);
      majorTicks.push({ label: String(d), p, bold: dt.getDay() === 1 });
    }
  } else {
    let td2 = new Date(minD.getFullYear(), minD.getMonth(), 1);
    while (td2 <= maxD) {
      const p = pctOf(td2);
      if (p >= -2 && p <= 102) majorTicks.push({ label: td2.toLocaleDateString('en-US',{month:'short',year:'2-digit'}), p });
      td2.setMonth(td2.getMonth()+1);
    }
  }

  // ── Milestones in current window ───────────────────────────────────────────
  const visibleMilestones = getMilestones().map(m => {
    const d = parseLocal(m.date);
    if (!d) return null;
    const p = pctOf(d);
    return (p >= 0 && p <= 100) ? { ...m, p } : null;
  }).filter(Boolean);

  // ── Zoom bar ───────────────────────────────────────────────────────────────
  let zoomBarHTML = '';
  if (zoomMode === 'overview') {
    const months = [];
    let td3 = new Date(new Date(Math.min(...allD)).getFullYear(), new Date(Math.min(...allD)).getMonth(), 1);
    const endMo = new Date(Math.max(...allD));
    while (td3 <= endMo) { months.push(new Date(td3)); td3.setMonth(td3.getMonth()+1); }
    zoomBarHTML = `<div style="display:flex;align-items:center;gap:6px;padding:6px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface2)">
      <span style="font-size:10px;font-family:var(--mono);color:var(--text3);margin-right:4px">drill into month →</span>
      ${months.map(m=>{
        const label = m.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
        const isToday = today.getMonth()===m.getMonth()&&today.getFullYear()===m.getFullYear();
        return `<button onclick="drillMonth(new Date(${m.getFullYear()},${m.getMonth()},1))" style="background:${isToday?'rgba(247,95,95,0.15)':'var(--surface)'};border:1px solid ${isToday?'var(--today)':'var(--border2)'};color:${isToday?'var(--today)':'var(--text2)'};font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer">${label}</button>`;
      }).join('')}
    </div>`;
  } else {
    const mLabel = zoomMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    zoomBarHTML = `<div style="display:flex;align-items:center;gap:10px;padding:6px 28px;border-bottom:1px solid var(--border);background:var(--surface2)">
      <button onclick="drillBack()" style="background:var(--surface);border:1px solid var(--border2);color:var(--accent);font-family:var(--mono);font-size:10px;padding:3px 10px;border-radius:4px;cursor:pointer">← overview</button>
      <span style="font-size:11px;font-family:var(--mono);color:var(--text);font-weight:500">${mLabel} — day-level view</span>
      <button onclick="drillMonth(new Date(${zoomMonth.getFullYear()},${zoomMonth.getMonth()-1},1))" style="background:var(--surface);border:1px solid var(--border2);color:var(--text2);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer">‹ prev</button>
      <button onclick="drillMonth(new Date(${zoomMonth.getFullYear()},${zoomMonth.getMonth()+1},1))" style="background:var(--surface);border:1px solid var(--border2);color:var(--text2);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer">next ›</button>
    </div>`;
  }

  // ── Tick row HTML ──────────────────────────────────────────────────────────
  const ticksHTML = `<div style="position:relative;height:${zoomMode==='month'?'22px':'20px'};min-width:${zoomMode==='month'?'600px':'400px'}">
    ${majorTicks.map(t=>`<span style="position:absolute;font-size:9px;font-family:var(--mono);color:${t.bold?'var(--text2)':'var(--text3)'};font-weight:${t.bold?'500':'400'};transform:translateX(-50%);left:${t.p.toFixed(2)}%;white-space:nowrap;pointer-events:none">${t.label}</span>`).join('')}
  </div>`;

  // ── Flag pins: positioned inside bar-col <th> only ────────────────────────
  // Stagger odd-indexed flags 8px lower so close labels don't collide
  // Compute task health per milestone for tooltip
  const msHealthData = visibleMilestones.map(m => {
    const msDate = parseLocal(m.date);
    const relatedTasks = msDate ? tasks.filter(t => {
      const sameFunc = !m.func || normalizeTaskText(m.func) === normalizeTaskText(t.func);
      const ed = parseLocal(t.end);
      return sameFunc && ed && ed <= msDate;
    }) : [];
    const overdue = relatedTasks.filter(t => t._rag === 'red').length;
    const atRisk  = relatedTasks.filter(t => t._rag === 'amber').length;
    const done    = relatedTasks.filter(t => t._rag === 'green').length;
    const total   = relatedTasks.length;
    const daysLeft = msDate ? Math.ceil((msDate - today) / 86400000) : null;
    return { overdue, atRisk, done, total, daysLeft };
  });

  const flagsHTML = visibleMilestones.length ? `
    <div style="position:relative;height:34px;overflow:visible;">
      ${visibleMilestones.map((m, i) => {
        const yo = (i % 2 === 0) ? 0 : 9;
        const poleH = 34 - yo;
        const lbl = m.label.length > 13 ? m.label.slice(0,12)+'\u2026' : m.label;
        const health = msHealthData[i];
        return `<div class="ms-flag-hit" style="position:absolute;left:${m.p.toFixed(2)}%;top:${yo}px;transform:translateX(-1.5px);z-index:12;padding:0 8px 0 0;"
          data-ms-type="gate"
          data-ms-label="${escapeHTML(m.label)}"
          data-ms-date="${m.date}"
          data-ms-function="${escapeHTML(m.func || '')}"
          data-ms-owner="${escapeHTML(m.owner || '')}"
          data-ms-status="${escapeHTML(m.status || '')}"
          data-ms-remarks="${escapeHTML(m.remarks || '')}"
          data-ms-days="${health.daysLeft}"
          data-ms-total="${health.total}"
          data-ms-overdue="${health.overdue}"
          data-ms-atrisk="${health.atRisk}"
          data-ms-done="${health.done}">
          <svg width="14" height="${poleH}" viewBox="0 0 14 ${poleH}" style="display:block;overflow:visible;">
            <line x1="2" y1="0" x2="2" y2="${poleH}" stroke="rgba(255,220,100,0.72)" stroke-width="1.5"/>
            <polygon points="2,2 14,7 2,12" fill="rgba(255,220,100,0.92)"/>
          </svg>
          <span style="position:absolute;top:1px;left:17px;font-size:7.5px;font-family:var(--mono);color:rgba(255,220,100,0.88);white-space:nowrap;letter-spacing:0.04em;pointer-events:none;">${lbl}</span>
        </div>`;
      }).join('')}
    </div>` : '';

  // Old milestone banner row removed — flag pins in <th> replace it
  const milestoneBarHTML = '';

  // ── Table ──────────────────────────────────────────────────────────────────
  const funcs = [...new Set(tasks.map(t=>t.func).filter(Boolean))];
  let html = `<table>
  <thead>
    <tr>
      <th style="min-width:200px">activity</th>
      <th style="min-width:72px">owner</th>
      <th style="min-width:58px">phase</th>
      <th style="min-width:68px">start</th>
      <th style="min-width:68px">end</th>
      <th style="min-width:${zoomMode==='month'?'600px':'440px'};padding-bottom:0;overflow:visible;position:relative;">${flagsHTML}${ticksHTML}</th>
    </tr>
  </thead><tbody>
  ${milestoneBarHTML}`;

  funcs.forEach(f => {
    const ft = tasks.filter(t => t.func === f);
    if (!ft.length) return;
    const isCollapsed = collapsedFuncs.has(f);

    // Section RAG summary — use pre-computed _rag
    const grpRed   = ft.filter(t=>t._rag==='red').length;
    const grpAmber = ft.filter(t=>t._rag==='amber').length;
    const ragSummary = grpRed
      ? `<span style="font-size:9px;color:var(--rag-red);font-family:var(--mono);margin-left:8px">▲ ${grpRed} overdue</span>`
      : grpAmber
      ? `<span style="font-size:9px;color:var(--rag-amber);font-family:var(--mono);margin-left:8px">● ${grpAmber} at risk</span>`
      : '';

    // Section row — data-action attribute, handled by delegated listener
    html += `<tr class="section-row${isCollapsed?' collapsed':''}">
      <td colspan="6" data-action="toggle-func" data-func='${escapeHTML(f)}' style="cursor:pointer">
        <span class="section-toggle">${isCollapsed?'▶':'▼'}</span>
        <span style="margin-right:8px;color:var(--text3);font-size:10px">${ft.length}</span>
        ${escapeHTML(f)}
        ${ragSummary}
      </td>
    </tr>`;

    ft.forEach(t => {
      const sDate = parseLocal(t.start);
      const eDate = parseLocal(t.end);
      if (!sDate || !eDate) return;
      const clampedStart = sDate < minD ? minD : sDate;
      const clampedEnd   = eDate > maxD ? maxD : eDate;
      const left  = pctOf(clampedStart);
      const right = pctOf(clampedEnd);
      const w     = Math.max(0.6, right - left);

      const rag    = t._rag;
      const color  = ragColor(rag);
      const rClass = ragClass(rag);

      // Grid lines
      const gridLines = majorTicks.map(tk =>
        `<div style="position:absolute;top:0;bottom:0;left:${tk.p.toFixed(2)}%;width:1px;background:${tk.bold?'rgba(255,255,255,0.10)':'var(--border)'};pointer-events:none"></div>`
      ).join('');

      // Milestone pole lines — solid thin gold, continuation of the flag’s pole
      const mLines = visibleMilestones.filter(m => !m.func || normalizeTaskText(m.func) === normalizeTaskText(t.func)).map(m =>
        `<div style="position:absolute;top:-3px;bottom:-3px;left:${m.p.toFixed(2)}%;width:0;border-left:1.5px solid rgba(255,220,100,0.38);z-index:8;pointer-events:none"></div>`
      ).join('');

      // Today line
      const todayLine = (todayPct>=0 && todayPct<=100)
        ? `<div style="position:absolute;top:-3px;bottom:-3px;left:${todayPct.toFixed(2)}%;width:2px;background:var(--today);z-index:6;border-radius:1px;pointer-events:none"></div>`
        : '';

      const tip = `${escapeHTML(t.activity)} | ${fmt(t.start)} → ${fmt(t.end)}${t.owner?' | '+escapeHTML(t.owner):''}`;
      const ownerActive = t.owner && t.owner === activeOwner ? ' active-owner' : '';

      // Task-linked milestone state
      const msKey = `${t.func}::${t.activity}`;
      const isTaskMs = taskMilestones.has(msKey);
      // Diamond at end-date position inside bar-outer
      const endPct = pctOf(clampedEnd);
      const ragLabel = {red:'Overdue',amber:'At Risk',green:'Done',blue:'In Progress',grey:'Not Started'}[rag] || 'Unknown';
      const taskDiamond = `<div class="task-ms-diamond${isTaskMs?' task-ms-diamond-hover':''}" style="display:${isTaskMs?'':'none'};position:absolute;left:${endPct.toFixed(2)}%;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:9px;height:9px;background:rgba(255,220,100,0.95);z-index:10;${isTaskMs?'pointer-events:auto;':'pointer-events:none;'}box-shadow:0 0 7px rgba(255,220,100,0.55);"
        data-ms-type="diamond"
        data-ms-label="${t.activity.replace(/"/g,'&quot;')}"
        data-ms-date="${t.end}"
        data-ms-owner="${(t.owner||'—').replace(/"/g,'&quot;')}"
        data-ms-start="${t.start}"
        data-ms-rag="${rag}"
        data-ms-rag-label="${ragLabel}"></div>`;

      html += `<tr${isCollapsed?' style="display:none"':''}>
        <td class="activity-cell">
          <span class="task-ms-btn${isTaskMs?' ms-active':''}" data-action="toggle-task-ms" data-key="${escapeHTML(msKey)}" title="${isTaskMs?'Remove milestone':'Mark as milestone'}">◆</span>${escapeHTML(t.activity)}</td>
        <td>${t.owner
          ? `<span class="owner-pill${ownerActive}" data-action="filter-owner" data-owner="${escapeHTML(t.owner)}" title="click to filter by ${escapeHTML(t.owner)}">${escapeHTML(t.owner)}</span>`
          : '<span style="color:var(--text3)">—</span>'}</td>
        <td><span class="phase-badge ${t.phase==='Phase 1'?'p1b':'p2b'}">${escapeHTML(t.phase)}</span></td>
        <td class="date-cell">${fmt(t.start)}</td>
        <td class="date-cell">${fmt(t.end)}</td>
        <td class="bar-col">
          <div class="bar-outer">
            ${gridLines}
            ${mLines}
            <div class="bar-fill ${rClass}" style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%;background:${color};opacity:0.88" title="${tip}"></div>
            ${todayLine}
            ${taskDiamond}
          </div>
        </td>
      </tr>`;
    });
  });

  html += `</tbody></table>`;

  const zoomEl = document.getElementById('zoom-bar');
  if (zoomEl) zoomEl.innerHTML = zoomBarHTML;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('table-wrap').style.display = 'block';
  document.getElementById('table-wrap').innerHTML = html;
}

function drillMonth(date) { zoomMode = 'month'; zoomMonth = date; renderTable(); }
function drillBack()       { zoomMode = 'overview'; zoomMonth = null; renderTable(); }

// Wire filters
['funcFilter','phaseFilter','ownerFilter','accountableFilter','statusFilter','priorityFilter'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (dashboardActive) renderDashboard(); else renderTable();
  });
});
// Sync ownerFilter dropdown -> activeOwner state
document.getElementById('ownerFilter').addEventListener('change', function() {
  activeOwner = this.value;
});

// ── Single global delegated listener on document.body (stable, survives re-renders) ──
document.body.addEventListener('click', function(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'filter-owner') {
    e.stopPropagation();
    filterByOwner(el.dataset.owner);

  } else if (action === 'toggle-func') {
    toggleFunc(el.dataset.func, el);

  } else if (action === 'toggle-task-ms') {
    toggleTaskMilestone(el.dataset.key, el);

  } else if (action === 'toggle-ms-panel') {
    const header = document.getElementById('ms-panel-header');
    const body   = document.getElementById('ms-panel-body');
    if (header && body) {
      header.classList.toggle('expanded');
      body.classList.toggle('open');
    }
  }
});

// ── Milestone tooltip — delegated hover handlers ─────────────────────────────
(function() {
  const tooltip = document.getElementById('ms-tooltip');
  const card    = document.getElementById('ms-tooltip-card');
  let hideTimer = null;

  function showTooltip(el, e) {
    const type = el.dataset.msType;
    if (!type) return;
    clearTimeout(hideTimer);

    let html = '';
    if (type === 'gate') {
      const label   = el.dataset.msLabel;
      const date    = el.dataset.msDate;
      const func    = el.dataset.msFunction || '';
      const owner   = el.dataset.msOwner || '';
      const sheetStatus = el.dataset.msStatus || '';
      const remarks = el.dataset.msRemarks || '';
      const days    = parseInt(el.dataset.msDays, 10);
      const total   = parseInt(el.dataset.msTotal, 10);
      const overdue = parseInt(el.dataset.msOverdue, 10);
      const atRisk  = parseInt(el.dataset.msAtrisk, 10);
      const done    = parseInt(el.dataset.msDone, 10);

      const fmtDate = (() => {
        const [y,m,d] = date.split('-').map(Number);
        const dt = new Date(y,m-1,d);
        return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      })();

      let daysText, daysClass;
      if (days > 0)      { daysText = days + ' day' + (days!==1?'s':'') + ' away'; daysClass = 'green'; }
      else if (days === 0){ daysText = 'Today!'; daysClass = 'amber'; }
      else                { daysText = Math.abs(days) + ' day' + (Math.abs(days)!==1?'s':'') + ' overdue'; daysClass = 'red'; }

      html = `
        <div class="ms-tooltip-title">🚩 ${escapeHTML(label)}</div>
        <div class="ms-tooltip-divider"></div>
        <div class="ms-tooltip-row"><span class="label">📅 Date</span><span class="value">${fmtDate}</span></div>
        ${func ? `<div class="ms-tooltip-row"><span class="label">Function</span><span class="value">${escapeHTML(func)}</span></div>` : ''}
        ${owner ? `<div class="ms-tooltip-row"><span class="label">Owner</span><span class="value">${escapeHTML(owner)}</span></div>` : ''}
        ${sheetStatus ? `<div class="ms-tooltip-row"><span class="label">Sheet Status</span><span class="value">${escapeHTML(sheetStatus)}</span></div>` : ''}
        ${remarks ? `<div class="ms-tooltip-row"><span class="label">Remarks</span><span class="value">${escapeHTML(remarks)}</span></div>` : ''}
        <div class="ms-tooltip-row"><span class="label">⏱ Status</span><span class="value ${daysClass}">${daysText}</span></div>
        <div class="ms-tooltip-row"><span class="label">📊 Tasks</span><span class="value">${total} due before this gate</span></div>
        ${(overdue || atRisk) ? `<div class="ms-tooltip-row" style="margin-top:4px;gap:4px">
          ${overdue ? `<span class="ms-tooltip-badge overdue">▲ ${overdue} overdue</span>` : ''}
          ${atRisk  ? `<span class="ms-tooltip-badge at-risk">● ${atRisk} at risk</span>` : ''}
          ${done    ? `<span class="ms-tooltip-badge on-track">✓ ${done} done</span>` : ''}
        </div>` : (done ? `<div class="ms-tooltip-row" style="margin-top:4px"><span class="ms-tooltip-badge on-track">✓ ${done} done</span></div>` : '')}
      `;
    } else if (type === 'diamond') {
      const label    = el.dataset.msLabel;
      const date     = el.dataset.msDate;
      const start    = el.dataset.msStart;
      const owner    = el.dataset.msOwner;
      const rag      = el.dataset.msRag;
      const ragLabel = el.dataset.msRagLabel;

      const fmtD = (s) => {
        const [y,m,d] = s.split('-').map(Number);
        return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
      };

      html = `
        <div class="ms-tooltip-title">◆ ${label}</div>
        <div class="ms-tooltip-divider"></div>
        <div class="ms-tooltip-row"><span class="label">📅 Dates</span><span class="value">${fmtD(start)} → ${fmtD(date)}</span></div>
        <div class="ms-tooltip-row"><span class="label">👤 Owner</span><span class="value">${owner}</span></div>
        <div class="ms-tooltip-row"><span class="label">🔶 Status</span><span class="value ${rag}">${ragLabel}</span></div>
      `;
    }

    card.innerHTML = html;

    // Position: near the element, auto above/below
    const rect = el.getBoundingClientRect();
    tooltip.style.left = rect.left + 'px';
    tooltip.classList.add('visible');

    // Measure tooltip height
    tooltip.style.top = '0px';
    const tipRect = tooltip.getBoundingClientRect();
    const tipH = tipRect.height;

    // Prefer below; if not enough space, go above
    const spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow >= tipH + 8) {
      tooltip.style.top = (rect.bottom + 6) + 'px';
    } else {
      tooltip.style.top = (rect.top - tipH - 6) + 'px';
    }

    // Keep within viewport horizontally
    const tipW = tooltip.getBoundingClientRect().width;
    if (rect.left + tipW > window.innerWidth - 12) {
      tooltip.style.left = (window.innerWidth - tipW - 12) + 'px';
    }
  }

  function hideTooltip() {
    hideTimer = setTimeout(() => {
      tooltip.classList.remove('visible');
    }, 80);
  }

  document.body.addEventListener('mouseover', function(e) {
    const flag = e.target.closest('.ms-flag-hit');
    if (flag) { showTooltip(flag, e); return; }
    const diamond = e.target.closest('.task-ms-diamond-hover');
    if (diamond) { showTooltip(diamond, e); return; }
    // Mouse moved to something that is NOT a flag or diamond — hide tooltip
    hideTooltip();
  });
})();

// ══════════════════════════════════════════════════════════════════════════
// EXECUTIVE HEALTH DASHBOARD
// ══════════════════════════════════════════════════════════════════════════
function renderDashboard() {
  const selFunc  = document.getElementById('funcFilter').value;
  const selPhase = document.getElementById('phaseFilter').value;
  const selOwner = document.getElementById('ownerFilter').value;
  const selAccountable = document.getElementById('accountableFilter') ? document.getElementById('accountableFilter').value : '';
  const selStatus = document.getElementById('statusFilter') ? document.getElementById('statusFilter').value : '';
  const selPriority = document.getElementById('priorityFilter') ? document.getElementById('priorityFilter').value : '';
  if (selOwner !== activeOwner) activeOwner = selOwner;

  const isExec = viewMode === 'execution';
  const source = isExec ? executionTasks : allTasks;

  let tasks = source.filter(t => {
    if (selFunc  && t.func  !== selFunc)  return false;
    if (selPhase && t.phase !== selPhase) return false;
    if (isExec) {
      if (activeOwner && t.responsible !== activeOwner) return false;
      if (selAccountable && t.accountable !== selAccountable) return false;
      if (selStatus && t.executionStatus !== selStatus) return false;
      if (selPriority && t.priority !== selPriority) return false;
    } else {
      if (activeOwner && t.owner !== activeOwner) return false;
    }
    return true;
  }).map(t => ({ ...t, _rag: isExec ? executionRagStatus(t) : ragStatus(t) }));

  const today = new Date(); today.setHours(0,0,0,0);

  // ── Section A: Macro Health Ribbon ──────────────────────────────────────
  const total = tasks.length;
  const isDoneStatus = t => {
    const s = (isExec ? t.executionStatus : t.status || '').toLowerCase().trim();
    return s === 'done' || s.includes('complete');
  };
  const doneCount = tasks.filter(isDoneStatus).length;
  const completionPct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

  const overdueCount = tasks.filter(t => t._rag === 'red').length;
  const atRiskCount  = tasks.filter(t => t._rag === 'amber').length;
  const completedCount = tasks.filter(t => t._rag === 'green').length;

  // ── Section B: Operational Friction Widgets ─────────────────────────────

  // Threshold Breaker: aging > 10 days, OR revisedEndDate > plannedEndDate
  // and status not In Progress / Done — uncompleted tasks only.
  const breaches = [];
  tasks.forEach(t => {
    if (isDoneStatus(t)) return;
    const statusLower = (isExec ? (t.executionStatus||'') : (t.status||'')).toLowerCase();
    const isInProgressOrDone = statusLower.includes('progress') || statusLower.includes('complete') || statusLower === 'done';

    const agingVal = parseFloat(t.aging);
    const agingBreach = Number.isFinite(agingVal) && agingVal > 10;

    const planned = parseLocalDate(t.plannedEndDate);
    const revised = parseLocalDate(t.revisedEndDate);
    const leadTimeBreach = planned && revised && revised > planned && !isInProgressOrDone;

    if (agingBreach || leadTimeBreach) {
      const reasons = [];
      if (agingBreach) reasons.push(`aging ${t.aging}d`);
      if (leadTimeBreach) reasons.push('lead-time extended');
      breaches.push({ task: t, reasons });
    }
  });

  // Bottleneck by Function — rank by Overdue + At Risk volume
  const funcMap = new Map();
  tasks.forEach(t => {
    if (!t.func) return;
    if (!funcMap.has(t.func)) funcMap.set(t.func, { func: t.func, red: 0, amber: 0, grey: 0, total: 0 });
    const entry = funcMap.get(t.func);
    entry.total++;
    if (t._rag === 'red') entry.red++;
    else if (t._rag === 'amber') entry.amber++;
    else entry.grey++;
  });
  const bottlenecks = [...funcMap.values()]
    .filter(e => (e.red + e.amber) > 0)
    .sort((a,b) => (b.red + b.amber) - (a.red + a.amber))
    .slice(0, 8);

  // Resource Accountability Matrix — owners ranked by uncompleted backlog
  const ownerMap = new Map();
  tasks.forEach(t => {
    const owner = isExec ? t.responsible : t.owner;
    if (!owner) return;
    if (isDoneStatus(t)) return;
    if (!ownerMap.has(owner)) ownerMap.set(owner, { owner, red: 0, amber: 0, grey: 0, total: 0 });
    const entry = ownerMap.get(owner);
    entry.total++;
    if (t._rag === 'red') entry.red++;
    else if (t._rag === 'amber') entry.amber++;
    else entry.grey++;
  });
  const ownerRanking = [...ownerMap.values()].sort((a,b) => b.total - a.total).slice(0, 8);
  const maxOwnerTotal = ownerRanking.length ? ownerRanking[0].total : 1;

  // ── Section C: Forward-Looking Gate Risks ───────────────────────────────
  const upcomingMilestones = getMilestones()
    .map(m => ({ ...m, _date: parseLocalDate(m.date) }))
    .filter(m => m._date && m._date >= today)
    .sort((a,b) => a._date - b._date)
    .slice(0, 3);

  const gateCards = upcomingMilestones.map(m => {
    const relatedTasks = tasks.filter(t => !m.func || normalizeTaskText(m.func) === normalizeTaskText(t.func));
    const daysAway = Math.ceil((m._date - today) / 86400000);
    const hasNotStarted = relatedTasks.some(t => {
      const s = (isExec ? (t.executionStatus||'') : (t.status||'')).toLowerCase().trim();
      return s.includes('not started') || (!s && t._rag === 'grey');
    });
    const highRisk = daysAway <= 5 && daysAway >= 0 && hasNotStarted;
    return {
      label: m.label, date: m.date, func: m.func, daysAway, highRisk,
      red: relatedTasks.filter(t=>t._rag==='red').length,
      amber: relatedTasks.filter(t=>t._rag==='amber').length,
      total: relatedTasks.length,
    };
  });

  // Lead-Time Slippage Volume — total count where revisedEndDate > plannedEndDate
  const slippageCount = tasks.filter(t => {
    const planned = parseLocalDate(t.plannedEndDate);
    const revised = parseLocalDate(t.revisedEndDate);
    return planned && revised && revised > planned;
  }).length;

  // ── Render ───────────────────────────────────────────────────────────────
  const fmtDate = s => {
    const d = parseLocalDate(s);
    return d ? d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
  };

  const ringRadius = 46;
  const ringCirc = 2 * Math.PI * ringRadius;
  const ringOffset = ringCirc * (1 - completionPct/100);

  const html = `
    <div class="dash-grid dash-row-a">
      <div class="dash-card">
        <div class="dash-card-title">Overall Completion</div>
        <div class="completion-ring-wrap">
          <svg width="110" height="110" viewBox="0 0 110 110">
            <circle cx="55" cy="55" r="${ringRadius}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
            <circle cx="55" cy="55" r="${ringRadius}" fill="none" stroke="var(--rag-green)" stroke-width="10"
              stroke-dasharray="${ringCirc.toFixed(2)}" stroke-dashoffset="${ringOffset.toFixed(2)}"
              stroke-linecap="round" transform="rotate(-90 55 55)" style="filter: drop-shadow(0 0 6px rgba(16,185,129,0.5))"/>
            <text x="55" y="61" text-anchor="middle" class="completion-ring-num" font-family="IBM Plex Mono">${completionPct}%</text>
          </svg>
          <div class="completion-sub">
            <div><b>${doneCount}</b> of <b>${total}</b> tasks marked Done / Complete</div>
            <div style="margin-top:6px;color:var(--text3)">Calculated from active filtered dataset based on selected function, phase, and owner filters.</div>
          </div>
        </div>
        <div class="dev-stats">merge ${executionMergeStats.matched || 0}/${executionMergeStats.total || 0}</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-title">Volume KPI Matrix</div>
        <div class="kpi-matrix">
          <div class="kpi-block overdue"><div class="kpi-num">${overdueCount}</div><div class="kpi-lbl">Overdue</div></div>
          <div class="kpi-block atrisk"><div class="kpi-num">${atRiskCount}</div><div class="kpi-lbl">At Risk</div></div>
          <div class="kpi-block done"><div class="kpi-num">${completedCount}</div><div class="kpi-lbl">Completed</div></div>
        </div>
        <div style="margin-top:14px;font-size:11px;color:var(--text2)">Total active filtered tasks: <b style="color:var(--text);font-family:var(--mono)">${total}</b></div>
      </div>
    </div>

    <div class="dash-section-label">Operational Friction</div>
    <div class="dash-grid dash-row-b">
      <div class="dash-card">
        <div class="dash-card-title">Threshold Breaker Alerts <span style="color:var(--rag-red)">${breaches.length}</span></div>
        ${breaches.length ? `<div class="breach-list">${breaches.slice(0, 12).map(b => `
          <div class="breach-item">
            <div>
              <div class="breach-item-name">${escapeHTML(b.task.activity)}</div>
              <div class="breach-item-meta">${escapeHTML(b.task.func || '')}${(isExec ? b.task.responsible : b.task.owner) ? ' · ' + escapeHTML(isExec ? b.task.responsible : b.task.owner) : ''}</div>
            </div>
            <span class="breach-tag">${b.reasons.map(escapeHTML).join(' · ')}</span>
          </div>`).join('')}</div>`
          : `<div class="dash-empty">No threshold breaches in the filtered dataset.</div>`}
      </div>
      <div class="dash-card">
        <div class="dash-card-title">Bottleneck by Function</div>
        ${bottlenecks.length ? `<div class="rank-list">${bottlenecks.map((b,i) => `
          <div class="rank-row">
            <div class="rank-pos">${i+1}</div>
            <div class="rank-name">${escapeHTML(b.func)}</div>
            <div class="rank-bar-track">
              <div class="rank-bar-seg red" style="width:${(b.red/b.total*100).toFixed(1)}%"></div>
              <div class="rank-bar-seg amber" style="width:${(b.amber/b.total*100).toFixed(1)}%"></div>
              <div class="rank-bar-seg grey" style="width:${(b.grey/b.total*100).toFixed(1)}%"></div>
            </div>
            <div class="rank-counts">${b.red} overdue · ${b.amber} at risk</div>
          </div>`).join('')}</div>`
          : `<div class="dash-empty">No functions currently have overdue or at-risk items.</div>`}
      </div>
      <div class="dash-card">
        <div class="dash-card-title">Resource Accountability Matrix</div>
        ${ownerRanking.length ? `<div class="rank-list">${ownerRanking.map((o,i) => `
          <div class="rank-row">
            <div class="rank-pos">${i+1}</div>
            <div class="rank-name">${escapeHTML(o.owner)}</div>
            <div class="rank-bar-track">
              <div class="rank-bar-seg red" style="width:${(o.red/maxOwnerTotal*100).toFixed(1)}%"></div>
              <div class="rank-bar-seg amber" style="width:${(o.amber/maxOwnerTotal*100).toFixed(1)}%"></div>
              <div class="rank-bar-seg grey" style="width:${(o.grey/maxOwnerTotal*100).toFixed(1)}%"></div>
            </div>
            <div class="rank-counts">${o.total} open tasks</div>
          </div>`).join('')}</div>`
          : `<div class="dash-empty">No owners with outstanding tasks in the filtered dataset.</div>`}
      </div>
    </div>

    <div class="dash-section-label">Forward-Looking Gate Risks</div>
    <div class="dash-grid dash-row-c">
      <div class="dash-card">
        <div class="dash-card-title">Milestone Risk Predictor — next 3 gates</div>
        ${gateCards.length ? `<div class="gate-grid">${gateCards.map(g => `
          <div class="gate-card${g.highRisk ? ' high-risk' : ''}">
            ${g.highRisk ? `<div class="gate-risk-flag">⚠ HIGH RISK</div>` : ''}
            <div class="gate-name">${escapeHTML(g.label)}</div>
            <div class="gate-date">${fmtDate(g.date)} · ${g.daysAway >= 0 ? g.daysAway + 'd away' : Math.abs(g.daysAway) + 'd overdue'}${g.func ? ' · ' + escapeHTML(g.func) : ''}</div>
            <div class="gate-stats">
              <span style="color:var(--rag-red)">${g.red} overdue</span>
              <span style="color:var(--rag-amber)">${g.amber} at risk</span>
              <span style="color:var(--text3)">${g.total} linked tasks</span>
            </div>
          </div>`).join('')}</div>`
          : `<div class="dash-empty">No upcoming milestones found in the MILESTONES sheet.</div>`}
      </div>
      <div class="dash-card">
        <div class="dash-card-title">Lead-Time Slippage Volume</div>
        <div class="slippage-card">
          <div class="slippage-num">${slippageCount}</div>
          <div class="slippage-sub">Operational timeline adjustments where the revised end date pushed past the originally planned end date, across the filtered dataset.</div>
        </div>
      </div>
    </div>
  `;

  const dashWrap = document.getElementById('dashboard-wrap');
  if (dashWrap) dashWrap.innerHTML = html;
  document.getElementById('loading').style.display = 'none';
}


setInterval(loadData, 5 * 60 * 1000);

loadData();
renderMilestoneList();
</script>
